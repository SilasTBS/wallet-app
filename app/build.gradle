plugins {
    id 'com.android.application' version '8.5.0' apply false
}

android {

    namespace 'com.wallet.tracker'

    compileSdk 35

    defaultConfig {

        applicationId "com.wallet.tracker"

        minSdk 29
        targetSdk 35

        versionCode 1
        versionName "1.0"
    }

    buildTypes {

        release {

            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
